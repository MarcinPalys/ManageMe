<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManageMe - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .story-card { cursor: pointer; transition: transform 0.2s; }
        .story-card:hover { transform: scale(1.02); }
        .active-project { border: 2px solid #0d6efd !important; background-color: #e9ecef; }
        .column-todo { border-top: 5px solid #6c757d; }
        .column-doing { border-top: 5px solid #0dcaf0; }
        .column-done { border-top: 5px solid #198754; }

        /* Dark mode */
        body.dark { background-color: #121212 !important; color: #ffffff; }
        body.dark .card { background-color: #1e1e1e; color: #fff; }
        body.dark .list-group-item { background-color: #1e1e1e; color: #fff; }
        body.dark .form-control,
        body.dark .form-select { background-color: #2c2c2c; color: #fff; border-color: #444; }
        body.dark .navbar { background-color: #000 !important; }
        body.dark #notif-popup .card { background-color: #1e1e1e; color: #fff; }

        /* Powiadomienia - badge */
        .notif-unread { border-left: 4px solid #0d6efd; }

        /* Popup powiadomień - stały, nie blokuje strony */
        #notif-popup {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 1055;
            width: 360px;
            display: none;
        }
        #notif-popup .card {
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            border: none;
        }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🚀 ManageMe</span>
        <div class="d-flex align-items-center gap-3">
            <a href="#" id="notif-nav-link" class="text-white text-decoration-none small">Powiadomienia</a>
            <span id="user-info" class="navbar-text text-white"></span>
            <a href="#" id="notif-badge-link" class="text-white text-decoration-none position-relative" title="Powiadomienia" style="font-size:1.2rem;">
                🔔
                <span id="notif-count"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      style="display:none; font-size:0.6rem; min-width:1.2rem;">0</span>
            </a>
            <div class="form-check form-switch text-white mb-0">
                <input class="form-check-input" type="checkbox" id="themeToggle">
                <label class="form-check-label" for="themeToggle">🌙</label>
            </div>
        </div>
    </div>
</nav>

<div class="container">

    <!-- WIDOK GŁÓWNY -->
    <div id="main-view">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Nowy Projekt</h5>
                        <input id="name" class="form-control mb-2" placeholder="Nazwa projektu">
                        <textarea id="description" class="form-control mb-2" placeholder="Opis"></textarea>
                        <button id="addBtn" class="btn btn-primary w-100">Dodaj projekt</button>
                    </div>
                </div>
                <h5>Twoje Projekty</h5>
                <div id="projects" class="list-group shadow-sm"></div>
            </div>

            <div class="col-md-8">
                <div id="story-section" style="display:none">
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <h5>Nowa Historyjka</h5>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <input id="storyName" class="form-control" placeholder="Nazwa historyjki">
                                </div>
                                <div class="col-md-3">
                                    <select id="storyPriority" class="form-select">
                                        <option value="low">Niski</option>
                                        <option value="medium">Średni</option>
                                        <option value="high">Wysoki</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <button id="addStoryBtn" class="btn btn-success w-100">Dodaj</button>
                                </div>
                                <div class="col-12">
                                    <input id="storyDesc" class="form-control" placeholder="Krótki opis">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row gx-3">
                        <div class="col-md-4">
                            <h6 class="text-center py-2 bg-secondary text-white rounded">TO DO</h6>
                            <div id="col-todo" class="py-2"></div>
                        </div>
                        <div class="col-md-4">
                            <h6 class="text-center py-2 bg-info text-white rounded">DOING</h6>
                            <div id="col-doing" class="py-2"></div>
                        </div>
                        <div class="col-md-4">
                            <h6 class="text-center py-2 bg-success text-white rounded">DONE</h6>
                            <div id="col-done" class="py-2"></div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5>Nowy Task</h5>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <input id="taskName" class="form-control" placeholder="Nazwa taska">
                            </div>
                            <div class="col-md-3">
                                <select id="taskPriority" class="form-select">
                                    <option value="low">Niski</option>
                                    <option value="medium">Średni</option>
                                    <option value="high">Wysoki</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <input id="taskTime" type="number" class="form-control" placeholder="Godz.">
                            </div>
                            <div class="col-md-3">
                                <select id="taskUser" class="form-select">
                                    <option value="">Przypisz użytkownika</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button id="addTaskBtn" class="btn btn-primary w-100">Dodaj Task</button>
                            </div>
                            <div class="col-12">
                                <input id="taskDesc" class="form-control" placeholder="Opis">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="no-project-alert" class="alert alert-secondary text-center">
                    Wybierz projekt z listy po lewej, aby zobaczyć zadania.
                </div>
            </div>
        </div>
    </div>

    <!-- WIDOK POWIADOMIEŃ -->
    <div id="notifications-view" style="display:none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Powiadomienia</h4>
            <div class="d-flex gap-2">
                <button id="markAllReadBtn" class="btn btn-sm btn-outline-secondary">
                    Oznacz wszystkie jako przeczytane
                </button>
                <button id="backToMainBtn" class="btn btn-sm btn-secondary">
                    ← Powrót
                </button>
            </div>
        </div>
        <div id="notifications-list"></div>
    </div>

</div>

<!-- MODAL: Szczegóły Taska -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Szczegóły Taska</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="taskDetails"></div>
            <div class="modal-footer">
                <button id="finishTaskBtn" class="btn btn-success">Zakończ Task</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Zamknij</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: Szczegóły Powiadomienia -->
<div class="modal fade" id="notif-detail-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="notif-detail-title">Powiadomienie</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="notif-detail-body"></div>
            <div class="modal-footer">
                <button id="notif-detail-mark-read" class="btn btn-primary">Oznacz jako przeczytane</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Zamknij</button>
            </div>
        </div>
    </div>
</div>

<!-- POPUP: Nowe powiadomienie (medium/high, pojawia się natychmiast) -->
<div id="notif-popup">
    <div class="card">
        <div class="card-header py-2 d-flex justify-content-between align-items-center" id="notif-popup-header">
            <div class="d-flex align-items-center gap-2">
                <strong class="small" id="notif-popup-title"></strong>
                <span id="notif-popup-queue" class="badge bg-secondary" style="font-size:0.65rem;"></span>
            </div>
            <button type="button" class="btn-close btn-sm" id="notif-popup-close"></button>
        </div>
        <div class="card-body py-2 px-3" id="notif-popup-body"></div>
        <div class="card-footer py-2 d-flex gap-2">
            <button id="notif-popup-read" class="btn btn-sm btn-primary">Oznacz jako przeczytane</button>
            <button id="notif-popup-dismiss" class="btn btn-sm btn-outline-secondary">Zamknij</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
